# Alembic 迁移配置（VeWealth backend）
#
# 说明：sqlalchemy.url 在 alembic/env.py 中被应用配置覆盖，
# 始终使用 app/core/config.py 的 DATABASE_URL（与应用运行配置保持一致）。
# 此处的 URL 仅作为 app 无法导入时的兜底值，非真实凭据。

[alembic]
# 迁移脚本目录（相对 backend/）
script_location = alembic

# 将 backend/（执行目录）加入 sys.path，保证裸 `alembic` 命令能 import app
# （env.py 顶部为 from app.core.config import settings / from app.models ...）
prepend_sys_path = .

# 兜底数据库 URL（实际由 env.py 覆盖为 settings.DATABASE_URL）
sqlalchemy.url = postgresql://postgres:CHANGE_ME@localhost:5432/vewealth

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
