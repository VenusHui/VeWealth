# Alembic 迁移配置（VeWealth backend）
#
# 说明：sqlalchemy.url 在 alembic/env.py 中被应用配置覆盖，
# 始终使用 app/core/config.py 的 DATABASE_URL（与应用运行配置保持一致）。
# 此处的 URL 仅作为 app 无法导入时的兜底值。

[alembic]
# 迁移脚本目录（相对 backend/）
script_location = alembic

# 兜底数据库 URL（实际由 env.py 覆盖为 settings.DATABASE_URL）
sqlalchemy.url = postgresql://postgres:password@localhost:5432/vewealth

# 关闭迁移文件自动生成时的行内注释
# (autogenerate 生成的 migration 会带注释，可手动精简)
# see https://alembic.sqlalchemy.org/en/latest/api/config.html#alembic.config.Config

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
