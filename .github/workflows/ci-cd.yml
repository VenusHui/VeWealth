name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
    branches:
      - main
      - dev/**

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vewealth

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # 锁定 black 版本，避免格式检查随版本漂移（VEW-12）
          pip install black==26.5.1

      - name: Run Python linting
        working-directory: ./backend
        run: |
          # 代码格式检查（失败时应直接失败）
          black --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript linting
        working-directory: ./frontend
        run: npm run lint

      # 前端纯计算逻辑单元测试（vitest，复用上方 npm ci 的依赖产物）
      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test

  # 后端单元测试
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend unit tests
        working-directory: ./backend
        run: |
          # 任一测试失败都会使该步骤失败，从而整体标红 CI
          python -m pytest tests -v

  # 密钥泄露扫描（VEW-13）：防止硬编码密钥（如微信公众号 AppID）再次合入代码库。
  # 只扫描本次变更新增的提交，避开仓库历史中早已存在的旧泄露（否则 CI 会永久标红）。
  # 历史泄露的处置（清理 history / 轮换密钥）见 VEW-13 issue 评论中的升级说明。
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 需要完整历史以计算扫描区间
          fetch-depth: 0

      - name: Determine scan range
        id: scan-range
        run: |
          # PR：与目标分支 base 对比；push：与本次推送前的 commit 对比。
          # 新建分支首次推送（before 为全 0）时退化为只扫最近一次提交。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="--max-count=1"
          else
            RANGE="${BASE}..${{ github.sha }}"
          fi
          echo "log_opts=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks on new changes
        run: |
          # 固定版本 v8.18.4，与 .gitleaks.toml 的 [extend] 配置格式对应
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect \
            --source . \
            --no-banner \
            --redact=100 \
            --verbose \
            --log-opts="${{ steps.scan-range.outputs.log_opts }}"

  # 构建测试
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vewealth-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: vewealth-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://124.221.239.27:8001
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署到云服务器
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, build, test]
    # 推送到 main 或任意 dev/** 分支时执行部署
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/dev/')
      )
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Display deployment info
        run: |
          echo "=========================================="
          echo "🚀 部署信息"
          echo "=========================================="
          echo "分支: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"
          echo "=========================================="

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 镜像构建（npm ci + next build）通常超过默认 10 分钟，超时会导致
          # docker-compose down 后构建中途被杀、生产容器停止（VEW-15）
          command_timeout: 30m
          script: |
            echo "=========================================="
            echo "🚀 开始部署 VeWealth"
            echo "=========================================="
            
            # 设置部署目录
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/repo/VeWealth' }}"
            
            # 如果目录不存在，克隆仓库
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "📦 克隆仓库..."
              git clone https://github.com/${{ github.repository }}.git $DEPLOY_DIR
            fi
            
            cd $DEPLOY_DIR
            
            # 拉取最新代码
            echo "📥 拉取最新代码..."
            BRANCH_NAME="${{ github.ref_name }}"
            echo "正在部署分支: $BRANCH_NAME"
            git fetch origin
            git reset --hard origin/$BRANCH_NAME
            
            # 检查配置文件
            if [ ! -f backend/settings/.prod.env ]; then
              echo "❌ 错误: backend/settings/.prod.env 文件不存在"
              echo "请先在服务器上配置生产环境文件"
              exit 1
            fi
            
            # 停止旧容器
            echo "🛑 停止旧容器..."
            docker-compose down || true
            
            # 清理未使用的镜像
            echo "🧹 清理旧镜像..."
            docker image prune -f
            
            bash docker-start.sh
            
            echo "=========================================="
            echo "✅ 部署完成！"
            echo "=========================================="

      - name: Notify Deployment Status
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "部署结果: ${{ job.status }}"
            echo "提交: ${{ github.sha }}"
            echo "分支: ${{ github.ref }}"
            echo "作者: ${{ github.actor }}"

