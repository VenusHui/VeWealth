name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vewealth

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python linting
        working-directory: ./backend
        run: |
          # 代码格式检查
          black --check . || echo "Black formatting check completed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript linting
        working-directory: ./frontend
        run: npm run lint

  # 构建测试
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vewealth-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: vewealth-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://124.221.239.27:8001
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署到云服务器
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, build]
    # 只在推送到 main 或特定 dev 分支时执行部署
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/dev/v1.0.0'
      )
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Display deployment info
        run: |
          echo "=========================================="
          echo "🚀 部署信息"
          echo "=========================================="
          echo "分支: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"
          echo "=========================================="

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "=========================================="
            echo "🚀 开始部署 VeWealth"
            echo "=========================================="
            
            # 设置部署目录
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/repo/VeWealth' }}"
            
            # 如果目录不存在，克隆仓库
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "📦 克隆仓库..."
              git clone https://github.com/${{ github.repository }}.git $DEPLOY_DIR
            fi
            
            cd $DEPLOY_DIR
            
            # 拉取最新代码
            echo "📥 拉取最新代码..."
            BRANCH_NAME="${{ github.ref_name }}"
            echo "正在部署分支: $BRANCH_NAME"
            git fetch origin
            git reset --hard origin/$BRANCH_NAME
            
            # 检查配置文件
            if [ ! -f backend/settings/.prod.env ]; then
              echo "❌ 错误: backend/settings/.prod.env 文件不存在"
              echo "请先在服务器上配置生产环境文件"
              exit 1
            fi
            
            # 停止旧容器
            echo "🛑 停止旧容器..."
            docker-compose down || true
            
            # 清理未使用的镜像
            echo "🧹 清理旧镜像..."
            docker image prune -f
            
            # 构建并启动新容器
            echo "🏗️  构建并启动容器..."
            ENV=prod docker-compose up -d --build
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 10
            
            # 检查服务状态
            echo "🔍 检查服务状态..."
            docker-compose ps
            
            # 健康检查
            echo "🏥 执行健康检查..."
            max_retries=30
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              if curl -f http://localhost:8001/health > /dev/null 2>&1; then
                echo "✅ 后端服务健康"
                break
              fi
              retry_count=$((retry_count + 1))
              echo "等待后端服务... ($retry_count/$max_retries)"
              sleep 2
            done
            
            if [ $retry_count -eq $max_retries ]; then
              echo "❌ 后端服务启动失败"
              docker-compose logs backend
              exit 1
            fi
            
            retry_count=0
            while [ $retry_count -lt $max_retries ]; do
              if curl -f http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ 前端服务健康"
                break
              fi
              retry_count=$((retry_count + 1))
              echo "等待前端服务... ($retry_count/$max_retries)"
              sleep 2
            done
            
            if [ $retry_count -eq $max_retries ]; then
              echo "❌ 前端服务启动失败"
              docker-compose logs frontend
              exit 1
            fi
            
            echo "=========================================="
            echo "✅ 部署完成！"
            echo "=========================================="

      - name: Notify Deployment Status
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "部署结果: ${{ job.status }}"
            echo "提交: ${{ github.sha }}"
            echo "分支: ${{ github.ref }}"
            echo "作者: ${{ github.actor }}"

