name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
    branches:
      - main
      - dev/**

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vewealth

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # 锁定 black 版本，避免格式检查随版本漂移（VEW-12）
          pip install black==26.5.1

      - name: Run Python linting
        working-directory: ./backend
        run: |
          # 代码格式检查（失败时应直接失败）
          black --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript linting
        working-directory: ./frontend
        run: npm run lint

  # 后端单元测试
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend unit tests
        working-directory: ./backend
        run: |
          # 任一测试失败都会使该步骤失败，从而整体标红 CI。
          # VEW-30 质量门禁：覆盖 引擎成交语义 / 绩效指标 / screener / API 集成 /
          # 并发隔离 / 重启恢复 / 性能回归，任一失败即整体标红。
          python -m pytest tests -v

  # 密钥泄露扫描（VEW-13）：防止硬编码密钥（如微信公众号 AppID）再次合入代码库。
  # 只扫描本次变更新增的提交，避开仓库历史中早已存在的旧泄露（否则 CI 会永久标红）。
  # 历史泄露的处置（清理 history / 轮换密钥）见 VEW-13 issue 评论中的升级说明。
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 需要完整历史以计算扫描区间
          fetch-depth: 0

      - name: Determine scan range
        id: scan-range
        run: |
          # PR：与目标分支 base 对比；push：与本次推送前的 commit 对比。
          # 新建分支首次推送（before 为全 0）时退化为只扫最近一次提交。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="--max-count=1"
          else
            RANGE="${BASE}..${{ github.sha }}"
          fi
          echo "log_opts=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks on new changes
        run: |
          # 固定版本 v8.18.4，与 .gitleaks.toml 的 [extend] 配置格式对应
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect \
            --source . \
            --no-banner \
            --redact=100 \
            --verbose \
            --log-opts="${{ steps.scan-range.outputs.log_opts }}"

  # 构建测试
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vewealth-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: vewealth-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://124.221.239.27:8001
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署到云服务器
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, build, test]
    # 推送到 main 或任意 dev/** 分支时执行部署
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/dev/')
      )
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Display deployment info
        run: |
          echo "=========================================="
          echo "🚀 部署信息"
          echo "=========================================="
          echo "分支: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"
          echo "=========================================="

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 镜像构建（npm ci + next build）通常超过默认 10 分钟，超时会导致
          # docker-compose down 后构建中途被杀、生产容器停止（VEW-15）
          command_timeout: 30m
          script: |
            echo "=========================================="
            echo "🚀 开始部署 VeWealth"
            echo "=========================================="
            
            # 设置部署目录
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/repo/VeWealth' }}"
            
            # 如果目录不存在，克隆仓库
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "📦 克隆仓库..."
              git clone https://github.com/${{ github.repository }}.git $DEPLOY_DIR
            fi
            
            cd $DEPLOY_DIR
            
            # 拉取最新代码
            echo "📥 拉取最新代码..."
            BRANCH_NAME="${{ github.ref_name }}"
            echo "正在部署分支: $BRANCH_NAME"
            git fetch origin
            git reset --hard origin/$BRANCH_NAME
            
            # 检查配置文件
            if [ ! -f backend/settings/.prod.env ]; then
              echo "❌ 错误: backend/settings/.prod.env 文件不存在"
              echo "请先在服务器上配置生产环境文件"
              exit 1
            fi
            
            # 部署前先看一眼磁盘，容量异常时日志里能直接看到（VEW-68）
            echo "📊 部署前磁盘使用："
            df -h / | tail -1

            # 停止旧容器
            echo "🛑 停止旧容器..."
            docker-compose down || true

            # 清理悬空镜像（未打标签、无容器引用）。
            # ⚠️ 绝不能加 -a：会删掉未被运行中容器引用的镜像，波及 vechart 等其它栈与回滚镜像。
            echo "🧹 清理悬空镜像..."
            docker image prune -f

            bash docker-start.sh

            # 清理构建缓存，防止 40G 单盘被每次部署累积的 BuildKit cache 持续吃满（VEW-68）。
            #
            # ⚠️ 封顶语义随 BuildKit 版本而变，升级 Docker 后会静默反转：
            #   - buildkit < 0.17（生产 Docker 26.1.3 = buildkit v0.13.2）：--keep-storage N 是「上限」，
            #     缓存总量超过 N 才削、削到 N 以下为止，按 last-used 最旧优先淘汰。
            #   - buildkit >= 0.17：--keep-storage 已弃用并改名为 --reserved-space，语义变成「下限」
            #     （只保证至少保留 N，永远不会收紧），封顶必须改用 --max-used-space N。
            #   故此处做一次能力探测，优先 --max-used-space、回退 --keep-storage，避免升级后静默失效。
            #
            # 不加 -a：VEW-68 压测（buildkit v0.13.2）实测 -f 已能把可回收缓存从 2.2GB 削到 700MB
            # （低于 1GB 上限），且随后的重建仍命中缓存（0s）；被镜像引用的 cache 层本就记在 Images
            # 名下、不是缓存膨胀的来源，加 -a 只会丢掉增量构建缓存、拖慢构建（VEW-15 的 30m 超时风险）。
            # ⚠️ 真正的坑是 `docker system prune --volumes`（会删掉 postgresql_postgres_data 数据卷）；
            #    `docker builder prune` 本身没有 --volumes 这个 flag。
            echo "🧹 清理构建缓存（封顶 1GB）..."
            # ⚠️ 两个分支各写各的字面量，不要用变量拼参数（VEW-68）：
            #   远端 sshd 用的是 ubuntu 的登录 shell（zsh），zsh 默认**不**对未加引号的
            #   参数展开做词分割，`CACHE_CAP="--keep-storage 1GB"; docker builder prune -f $CACHE_CAP`
            #   会把整个字符串当成**一个**参数，报 `unknown flag: --keep-storage 1GB`，
            #   封顶静默失效（2026-10-06 生产实测：Build Cache 28 项 / 1.229GB 全部可回收）。
            #   字面量写法不依赖任何 shell 的词分割语义。
            prune_ok=0
            if docker builder prune --help 2>&1 | grep -q -- '--max-used-space'; then
              echo "   （使用 --max-used-space 1GB，buildkit >= 0.17 语义）"
              docker builder prune -f --max-used-space 1GB || prune_ok=1
            else
              echo "   （使用 --keep-storage 1GB，buildkit < 0.17 语义）"
              docker builder prune -f --keep-storage 1GB || prune_ok=1
            fi
            if [ "$prune_ok" -ne 0 ]; then
              echo "⚠️⚠️⚠️ 构建缓存清理失败：磁盘可能在持续增长，请人工检查（VEW-68）⚠️⚠️⚠️"
            fi

            echo "📊 部署后磁盘使用："
            df -h / | tail -1

            echo "=========================================="
            echo "✅ 部署完成！"
            echo "=========================================="

      - name: Notify Deployment Status
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "部署结果: ${{ job.status }}"
            echo "提交: ${{ github.sha }}"
            echo "分支: ${{ github.ref }}"
            echo "作者: ${{ github.actor }}"

