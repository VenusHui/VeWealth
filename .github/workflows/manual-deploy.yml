name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: '跳过测试（不推荐）'
        required: false
        type: boolean
        default: false

jobs:
  manual-deploy:
    name: Manual Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display deployment info
        run: |
          echo "=========================================="
          echo "🚀 手动部署触发"
          echo "=========================================="
          echo "环境: ${{ inputs.environment }}"
          echo "分支: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          echo "触发者: ${{ github.actor }}"
          echo "跳过测试: ${{ inputs.skip_tests }}"
          echo "=========================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        if: ${{ !inputs.skip_tests }}
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend unit tests
        if: ${{ !inputs.skip_tests }}
        working-directory: ./backend
        run: |
          # 任一测试失败都会使该步骤失败，从而阻止部署
          python -m pytest tests -v

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 与 ci-cd.yml 保持一致：镜像构建可能超过默认 10 分钟（VEW-15）
          command_timeout: 30m
          script: |
            echo "=========================================="
            echo "🚀 手动部署 VeWealth - ${{ inputs.environment }}"
            echo "=========================================="
            
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/repo/VeWealth' }}"
            
            cd $DEPLOY_DIR
            
            # 拉取最新代码
            echo "📥 拉取最新代码..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # 显示当前版本信息
            echo "📋 当前版本信息："
            echo "  提交: $(git rev-parse --short HEAD)"
            echo "  作者: $(git log -1 --pretty=format:'%an')"
            echo "  时间: $(git log -1 --pretty=format:'%ar')"
            echo "  消息: $(git log -1 --pretty=format:'%s')"
            
            # 检查配置文件
            if [ ! -f backend/settings/.prod.env ]; then
              echo "❌ 错误: backend/settings/.prod.env 文件不存在"
              exit 1
            fi
            
            # 部署前先看一眼磁盘，容量异常时日志里能直接看到（VEW-68）
            echo "📊 部署前磁盘使用："
            df -h / | tail -1

            # 停止服务
            echo "🛑 停止服务..."
            docker-compose down

            # 清理悬空镜像（上一版镜像在 up --build 后会变成 dangling，这条路同样在堆）。
            # ⚠️ 绝不能加 -a：会删掉未被运行中容器引用的镜像，波及 vechart 等其它栈与回滚镜像。
            echo "🧹 清理悬空镜像..."
            docker image prune -f

            # 构建并启动
            echo "🏗️  构建并启动服务..."
            ENV=prod docker-compose up -d --build

            # 清理构建缓存，防止 40G 单盘被每次部署累积的 BuildKit cache 持续吃满（VEW-68）。
            #
            # ⚠️ 封顶语义随 BuildKit 版本而变，升级 Docker 后会静默反转：
            #   - buildkit < 0.17（生产 Docker 26.1.3 = buildkit v0.13.2）：--keep-storage N 是「上限」，
            #     缓存总量超过 N 才削、削到 N 以下为止，按 last-used 最旧优先淘汰。
            #   - buildkit >= 0.17：--keep-storage 已弃用并改名为 --reserved-space，语义变成「下限」
            #     （只保证至少保留 N，永远不会收紧），封顶必须改用 --max-used-space N。
            #   故此处做一次能力探测，优先 --max-used-space、回退 --keep-storage，避免升级后静默失效。
            #
            # 不加 -a：VEW-68 压测（buildkit v0.13.2）实测 -f 已能把可回收缓存从 2.2GB 削到 700MB
            # （低于 1GB 上限），且随后的重建仍命中缓存（0s）；被镜像引用的 cache 层本就记在 Images
            # 名下、不是缓存膨胀的来源，加 -a 只会丢掉增量构建缓存、拖慢构建（VEW-15 的 30m 超时风险）。
            # ⚠️ 真正的坑是 `docker system prune --volumes`（会删掉 postgresql_postgres_data 数据卷）；
            #    `docker builder prune` 本身没有 --volumes 这个 flag。
            echo "🧹 清理构建缓存（封顶 1GB）..."
            # ⚠️ 两个分支各写各的字面量，不要用变量拼参数（VEW-68）：
            #   远端 sshd 用的是 ubuntu 的登录 shell（zsh），zsh 默认**不**对未加引号的
            #   参数展开做词分割，`CACHE_CAP="--keep-storage 1GB"; docker builder prune -f $CACHE_CAP`
            #   会把整个字符串当成**一个**参数，报 `unknown flag: --keep-storage 1GB`，
            #   封顶静默失效（2026-10-06 生产实测：Build Cache 28 项 / 1.229GB 全部可回收）。
            #   字面量写法不依赖任何 shell 的词分割语义。
            prune_ok=0
            if docker builder prune --help 2>&1 | grep -q -- '--max-used-space'; then
              echo "   （使用 --max-used-space 1GB，buildkit >= 0.17 语义）"
              docker builder prune -f --max-used-space 1GB || prune_ok=1
            else
              echo "   （使用 --keep-storage 1GB，buildkit < 0.17 语义）"
              docker builder prune -f --keep-storage 1GB || prune_ok=1
            fi
            if [ "$prune_ok" -ne 0 ]; then
              echo "⚠️⚠️⚠️ 构建缓存清理失败：磁盘可能在持续增长，请人工检查（VEW-68）⚠️⚠️⚠️"
            fi

            echo "📊 部署后磁盘使用："
            df -h / | tail -1

            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 10
            
            # 健康检查
            echo "🏥 健康检查..."
            max_retries=30
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              if curl -f http://localhost:8001/health > /dev/null 2>&1; then
                echo "✅ 后端服务正常"
                break
              fi
              retry_count=$((retry_count + 1))
              echo "等待后端服务... ($retry_count/$max_retries)"
              sleep 2
            done
            
            if [ $retry_count -eq $max_retries ]; then
              echo "❌ 后端服务健康检查失败"
              docker-compose logs --tail=50 backend
              exit 1
            fi
            
            retry_count=0
            while [ $retry_count -lt $max_retries ]; do
              if curl -f http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ 前端服务正常"
                break
              fi
              retry_count=$((retry_count + 1))
              echo "等待前端服务... ($retry_count/$max_retries)"
              sleep 2
            done
            
            if [ $retry_count -eq $max_retries ]; then
              echo "❌ 前端服务健康检查失败"
              docker-compose logs --tail=50 frontend
              exit 1
            fi
            
            # 显示服务状态
            echo ""
            echo "📊 服务状态："
            docker-compose ps
            
            echo ""
            echo "=========================================="
            echo "✅ 手动部署完成！"
            echo "=========================================="

      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 手动部署摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **环境**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **状态**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "查看详细日志以获取更多信息。" >> $GITHUB_STEP_SUMMARY

